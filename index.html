<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro de Usuário</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <script type="text/javascript"
        src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js">
</script>
    </head>

    <body>

        <div class="container mt-4">

            <div class="bg-dark text-white text-center p-3 mb-3">
                <h2>Formulário de Cadastro</h2>
            </div>

            <form id="formCadastro">

                <!-- Nome e Sobrenome -->
                <div class="row mb-3">

                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text"
                               class="form-control"
                               id="nome"
                               placeholder="Nome">
                    </div>

                    <div class="col-md-6">
                        <label for="sobrenome" class="form-label">Sobrenome</label>
                        <input type="text"
                               class="form-control"
                               id="sobrenome"
                               placeholder="Sobrenome">
                    </div>

                </div>

                <!-- Email e Senha -->
                <div class="row mb-3">

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email"
                               class="form-control"
                               id="email">
                    </div>

                    <div class="col-md-6">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password"
                               class="form-control"
                               id="senha">
                    </div>

                </div>

                <h4 class="mb-3">Endereço</h4>

                <!-- CEP, Rua e Bairro -->
                <div class="row mb-3">

                    <div class="col-md-2">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text"
                               class="form-control"
                               id="cep">
                    </div>

                    <div class="col-md-6">
                        <label for="rua" class="form-label">Rua</label>
                        <input type="text"
                               class="form-control"
                               id="rua"
                               placeholder="Rua">
                    </div>

                    <div class="col-md-4">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text"
                               class="form-control"
                               id="bairro"
                               placeholder="Bairro">
                    </div>

                </div>

                <!-- Cidade, Estado, Número e Complemento -->
                <div class="row mb-3">

                    <div class="col-md-4">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text"
                               class="form-control"
                               id="cidade">
                    </div>

                    <div class="col-md-2">
                        <label for="estado" class="form-label">Estado</label>
                        <input type="text"
                               class="form-control"
                               id="estado">
                    </div>

                    <div class="col-md-2">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text"
                               class="form-control"
                               id="numero">
                    </div>

                    <div class="col-md-4">
                        <label for="complemento" class="form-label">Complemento</label>
                        <input placeholder="Opcional" type="text"
                               class="form-control"
                               id="complemento">
                    </div>

                </div>

                <button type="submit" class="btn btn-dark">
                    Cadastrar
                </button>

            </form>

        </div>

        <script src="main.js"></script>
        <script src="validation.js"></script>
    </body>
</html>
